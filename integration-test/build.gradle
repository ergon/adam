plugins {
    id 'java'
}

group = 'ch.ergon.adam'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

ext.jooqProUser = hasProperty("jooqProUser") ? property("jooqProUser").toString() : rootProject.getLocalProperty("JOOQ_PRO_USER")
ext.jooqProPassword = hasProperty("jooqProPassword") ? property("jooqProPassword").toString() : rootProject.getLocalProperty("JOOQ_PRO_PASSWORD")

repositories {
    mavenCentral()
    maven {
        url = uri("https://repo.jooq.org/repo")
        credentials {
            username = jooqProUser
            password = jooqProPassword
        }
    }
}

dependencies {
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testImplementation project(':core')
    testImplementation project(':yml')
    testImplementation project(':postgresql')
    testImplementation project(':oracle')
    testImplementation project(':mariadb')
    testImplementation project(':sqlite')
    testImplementation project(':integration-test-db')
    testImplementation project(':gradle-plugin')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testImplementation 'org.hamcrest:hamcrest:3.0'
    testImplementation("org.testcontainers:testcontainers:2.0.5")
    testImplementation("org.testcontainers:testcontainers-junit-jupiter:2.0.5")
    testImplementation("org.testcontainers:testcontainers-postgresql:2.0.5")
    testImplementation("org.postgresql:postgresql:42.7.14")
    testImplementation("org.testcontainers:testcontainers-oracle-free:2.0.5")
    testImplementation('com.oracle.database.jdbc:ojdbc11:23.26.3.0.0')
    testImplementation('org.testcontainers:testcontainers-mariadb:2.0.5')
    testImplementation('org.mariadb.jdbc:mariadb-java-client:3.5.10')
    testImplementation('org.xerial:sqlite-jdbc:3.53.4.0')
    testImplementation('org.jooq.pro:jooq:3.19.39')
}

test {
    useJUnitPlatform()
}

import static java.nio.charset.StandardCharsets.UTF_8

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'com.github.jk1.dependency-license-report' version '3.1.4'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

apply from: "${rootProject.projectDir}/common.gradle"

group = 'ch.ergon.adam'

licenseReport {
    allowedLicensesFile = new File("$projectDir/allowed-licenses.json")
    // Only check what ends up as dependency of the published artifacts
    // The root project must come first: the report renderers read their configuration from it
    projects = ([project] + subprojects.findAll { !it.name.startsWith('integration-test') }) as Project[]
    configurations = ['runtimeClasspath'] as String[]

    checkLicense {
        outputs.upToDateWhen { false }
    }

    generateLicenseReport {
        outputs.upToDateWhen { false }
    }

}

ext.getLocalProperty = { key, file = "local.properties" ->
    def properties = new Properties()
    def localProperties = new File(rootProject.rootDir, file)
    if (localProperties.isFile()) {
        new InputStreamReader(new FileInputStream(localProperties), UTF_8).with {properties.load(it)}
        return properties.getProperty(key, "")
    } else {
        return null
    }
}
